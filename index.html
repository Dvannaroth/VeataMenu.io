<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Horizon Menu</title>
    <link rel="stylesheet" href="style.css">
    <!-- Optional: Add a Google Font for better Khmer typography rendering -->
    <link href="https://fonts.googleapis.com/css2?family=Khmer&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <aside class="sidebar">
            <!-- Language Toggle Button -->
            <div class="lang-toggle-container">
                <button id="lang-toggle" class="lang-btn">កម្ពុជា / EN</button>
            </div>

            <h2 id="sidebar-title" data-en="Veata Restaurant & Skylounge" data-km="ភោជនីយដ្ឋាន វាតា & ស្កាយឡោញ">Veata Restaurant & Skylounge</h2>
            <p class="subtitle" id="sidebar-subtitle" data-en="Fresh & Authentic" data-km="ស្រស់ៗ & រសជាតិដើម">Fresh & Authentic</p>
            
            <nav class="btn-container">
                <button class="filter-btn active" data-id="all" data-en="All Items" data-km="មុខម្ហូបទាំងអស់">All Items</button>
                <button class="filter-btn" data-id="asian" data-en="Asian Food" data-km="អាហារអាស៊ី">Asian Food</button>
                <button class="filter-btn" data-id="europe" data-en="Europe Food" data-km="អាហារអឺរ៉ុប">Europe Food</button>
                <button class="filter-btn" data-id="drinks" data-en="Drinks" data-km="ភេសជ្ជៈ">Drinks</button>
            </nav>
        </aside>

        <main class="main-content">
            <div class="menu-grid" id="menu-container"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
